name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      # On main, replace the rolling "latest" release so the newest APK always has the same URL.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvhome.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tvhome.apk \
            --title "Latest build" \
            --notes "Build of ${GITHUB_SHA::7}. Install with: adb install -r tvhome.apk" \
            --prerelease \
            --target "$GITHUB_SHA"
