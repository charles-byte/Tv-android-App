name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      # On main, replace the rolling "latest" release so the newest APK always has the same URL.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvhome.apk
          cp app/build/outputs/apk/debug/app-debug.apk tvhome-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tvhome.apk tvhome-debug.apk \
            --title "Latest build" \
            --notes "Build of ${GITHUB_SHA::7}. Install with: adb install -r tvhome.apk" \
            --prerelease \
            --target "$GITHUB_SHA"

  # Renders the home screen to a PNG and publishes it on the "screenshots" branch,
  # so the design can be reviewed before installing.
  screenshots:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Publish to screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp app/build/screenshots/*.png out/
          ls out
          cd out
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
